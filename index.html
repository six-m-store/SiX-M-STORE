let orderList = [];


function addProduct(
name,
price,
unit
){

);

return;

}


let existing =
orderList.find(function(item){

return item.name === name;

});


if(existing){

existing.qty++;

}

else{

orderList.push({

name:name,

price:price,

unit:unit,

qty:1

});

}


renderOrder();

openOrder();

}

/* =========================================================
   QUANTITY
   ========================================================= */

function changeQty(index,value){

orderList[index].qty += value;


if(orderList[index].qty < 1){

orderList[index].qty = 1;

}


renderOrder();

}


function setQty(index,value){

value =
parseInt(value);


if(
isNaN(value) ||
value < 1
){

value = 1;

}


orderList[index].qty =
value;


renderOrder();

}


/* =========================================================
   REMOVE
   ========================================================= */

function removeItem(index){

orderList.splice(
index,
1
);

renderOrder();

}


/* =========================================================
   TOTAL
   ========================================================= */

function calculateTotal(){

let subtotal = 0;


orderList.forEach(function(item){

subtotal +=
item.price *
item.qty;

});


let delivery =
orderList.length > 0
?
99
:
0;


document.getElementById(
"subtotal"
).innerText =
subtotal;


document.getElementById(
"deliveryCharge"
).innerText =
delivery;


document.getElementById(
"grandTotal"
).innerText =
subtotal + delivery;

}
